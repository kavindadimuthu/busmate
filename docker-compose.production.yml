# Production backend stack.
#
# Only api-gateway is published to the host. Downstream services keep their
# stable internal ports on the Docker network:
#   core-service      : 9010
#   user-service      : 9020
#   ticketing-service : 9030
#   api-gateway       : 8080
services:
  api-gateway:
    build:
      context: apps/backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Secrets come from the central file; topology (ports, internal URLs) is set
    # inline here and overrides the local-dev URLs from the file.
    env_file:
      - config/secrets/.env
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:9020
      - CORE_SERVICE_URL=http://core-service:9010
      - TICKETING_SERVICE_URL=http://ticketing-service:9030
      - NODE_ENV=production
    depends_on:
      user-service:
        condition: service_started
      core-service:
        condition: service_started
      ticketing-service:
        condition: service_started
    restart: unless-stopped

  user-service:
    build:
      context: apps/backend/user-service
      dockerfile: Dockerfile
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9020
      - CORE_SERVICE_URL=http://core-service:9010
      - SPRING_PROFILES_ACTIVE=prod
    expose:
      - "9020"
    restart: unless-stopped

  core-service:
    build:
      context: apps/backend/core-service
      dockerfile: Dockerfile
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9010
      - SPRING_PROFILES_ACTIVE=prod
    expose:
      - "9010"
    restart: unless-stopped

  ticketing-service:
    build:
      context: apps/backend/ticketing-service
      dockerfile: Dockerfile
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9030
      - SPRING_PROFILES_ACTIVE=prod
    expose:
      - "9030"
    restart: unless-stopped

  # Event broker for the IoT/telemetry pipeline (IoT Platform Layer plan, Phase 0). This
  # self-hosted single node is the simplest thing that works; swap KAFKA_BOOTSTRAP_SERVERS on
  # the services below to a managed Kafka (e.g. Redpanda Cloud / MSK) and drop this block to
  # externalize it. Not published to the host — only reachable on the internal network.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092
    expose:
      - "9092"
    volumes:
      - busmate_prod_redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  telemetry-service:
    build:
      context: apps/backend/telemetry-service
      dockerfile: Dockerfile
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9040
      - SPRING_PROFILES_ACTIVE=prod
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    expose:
      - "9040"
    depends_on:
      redpanda:
        condition: service_started
    restart: unless-stopped

volumes:
  busmate_prod_redpanda_data:
