name: busmate

# Covers the backend services currently exposed through api-gateway.
# api-gateway is the main entry point on 8080. Downstream services also publish
# their standard development ports for direct debugging and OpenAPI generation.
#
# user-service's Dockerfile expects a pre-built jar (COPY target/*.jar app.jar) — run
# `./mvnw -f apps/backend/user-service package` before `docker compose up --build`.
# core-service's Dockerfile expects a pre-built jar under apps/backend/core-service/target/.
#
# Backend services run with SPRING_PROFILES_ACTIVE=dev against the local `postgres`
# service below (one instance, one database per service — see
# scripts/postgres/init-dev-dbs.sql). Production Supabase credentials from
# config/secrets/.env are not used here even though env_file loads them; the
# SPRING_DATASOURCE_* overrides below take precedence. See docker-compose.production.yml
# for the prod profile, which does use those Supabase values.
#
# Host port is 5433 (not 5432) to avoid clashing with a Postgres install you may
# already be running locally. If you already have local Postgres on 5432, you can
# skip this container entirely and just `createdb` the three databases below —
# application-dev.yml's defaults already point at localhost:5432.
#
# Distributed tracing (Phase 6): every service below exports OTLP traces to Tempo,
# which lives in the separate docker-compose.observability.yml stack. `extra_hosts`
# + `host.docker.internal` is how each service reaches it despite being on a different
# Compose project's network (same trick already used for Prometheus/Uptime Kuma to
# reach these services in the other direction). If the observability stack isn't
# running, the OTLP exports just fail silently in the background — no impact on the
# app itself. See config/observability/README.md.
services:
  # Optional GUI for this database: tools/dbgate/README.md (`pnpm db:dev:gui`).
  postgres:
    image: postgres:16-alpine
    container_name: busmate-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - busmate_dev_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-dev-dbs.sql:/docker-entrypoint-initdb.d/init-dev-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Kafka-compatible event broker for the IoT/telemetry pipeline (IoT Platform Layer plan,
  # Phase 0) and the general backend event bus. Redpanda is a single binary — no ZooKeeper,
  # no JVM — so one lightweight container gives dev a real Kafka API. It also finally gives
  # user-service's existing Kafka producer (operator-events / user events) a broker to reach
  # locally; before this there was none in dev.
  #
  # Two listeners: containers on this Compose network connect to redpanda:9092 (INTERNAL);
  # processes on the host (a service run straight from the jar, rpk, Kafka UIs) connect to
  # localhost:9092, which maps to the EXTERNAL listener advertised as localhost. This is why
  # backend services set KAFKA_BOOTSTRAP_SERVERS=redpanda:9092 below while the app configs'
  # host-dev default is localhost:9092.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: busmate-dev-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:9092
    ports:
      - "9092:19092"   # host access (EXTERNAL listener)
      - "9644:9644"    # Redpanda admin API
    volumes:
      - busmate_dev_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-gateway:
    build:
      context: apps/backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Secrets come from the central file; topology (ports, internal URLs) is set
    # inline here and overrides the local-dev URLs from the file.
    env_file:
      - config/secrets/.env
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:9020
      - CORE_SERVICE_URL=http://core-service:9010
      - TICKETING_SERVICE_URL=http://ticketing-service:9030
      - TELEMETRY_SERVICE_URL=http://telemetry-service:9040
      - NODE_ENV=production
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      user-service:
        condition: service_started
      core-service:
        condition: service_started
      ticketing-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: apps/backend/user-service
      dockerfile: Dockerfile
    ports:
      - "9020:9020"
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9020
      - CORE_SERVICE_URL=http://core-service:9010
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/busmate_user
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - OTEL_SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  core-service:
    build:
      context: apps/backend/core-service
      dockerfile: Dockerfile
    # Runs internally on 9010 so api-gateway can own public host port 8080.
    ports:
      - "9010:9010"
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9010
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/busmate_core
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - OTEL_SERVICE_NAME=core-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  ticketing-service:
    build:
      context: apps/backend/ticketing-service
      dockerfile: Dockerfile
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9030
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/busmate_ticketing
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - OTEL_SERVICE_NAME=ticketing-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    ports:
      - "9030:9030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # IoT / device telemetry ingestion service (IoT Platform Layer plan, Phase 0). Owns the
  # device registry, protocol adapters, and the live-state store; publishes normalized events
  # to Redpanda for the rest of the platform to consume. Internal port 9040.
  telemetry-service:
    build:
      context: apps/backend/telemetry-service
      dockerfile: Dockerfile
    ports:
      - "9040:9040"
    env_file:
      - config/secrets/.env
    environment:
      - SERVER_PORT=9040
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/busmate_telemetry
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - CORE_SERVICE_URL=http://core-service:9010
      - OTEL_SERVICE_NAME=telemetry-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      core-service:
        condition: service_started

volumes:
  busmate_dev_postgres_data:
  busmate_dev_redpanda_data:
