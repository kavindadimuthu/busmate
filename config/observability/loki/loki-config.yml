# Single-binary Loki 3.x, filesystem storage — right-sized for a self-hosted Compose host.
# Not for horizontal scale; when you outgrow it, point Alloy's loki.write at Grafana Cloud
# (same push API) instead of re-architecting.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h            # 14 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  allow_structured_metadata: true
  volume_enabled: true              # enables the log-volume panel in Grafana
  max_label_names_per_series: 20

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
