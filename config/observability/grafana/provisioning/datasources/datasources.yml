apiVersion: 1

datasources:
  - name: Prometheus
    uid: busmate-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid: busmate-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      # Correlate logs → metrics: a requestId/trace can pivot by the `service` label.
      derivedFields: []
