apiVersion: 1

datasources:
  - name: Prometheus
    uid: busmate-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid: busmate-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      # Logs -> traces (Phase 6): a `trace_id` field in a JSON log line (injected into
      # MDC by the OTel Java agent / Node SDK) becomes a clickable link straight to the
      # matching Tempo trace.
      derivedFields:
        - datasourceUid: busmate-tempo
          matcherRegex: '"trace_id":"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    uid: busmate-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      # Traces -> logs (Phase 6): jump from a span straight to the matching log lines.
      tracesToLogsV2:
        datasourceUid: busmate-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="docker"} | json | trace_id="${__trace.traceId}"'
