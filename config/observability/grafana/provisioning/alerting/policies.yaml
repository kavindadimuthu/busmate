apiVersion: 1

# Single default policy routing everything to the webhook contact point, grouped by
# alertname+severity so a flapping alert doesn't spam one notification per evaluation.
# Split this into per-severity routes (e.g. critical -> paging channel, warning ->
# a low-priority channel) once you have more than one real contact point.
policies:
  - orgId: 1
    receiver: busmate-webhook
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
