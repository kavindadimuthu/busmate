apiVersion: 1

# Routed by severity (INC-036) — a warning cannot bury a critical, even sharing one contact
# point. Only one real channel exists today (a Discord webhook, config/secrets/.env), so "route"
# here means different grouping and repeat behaviour, not a different destination: a critical
# groups fast and chases you every 30 minutes while it's still firing; a warning waits longer to
# group and repeats far less often, so routine noise doesn't retrain you to ignore the channel.
# Revisit once a second contact point (a paging service, a second channel) actually exists.
policies:
  - orgId: 1
    receiver: busmate-discord
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: busmate-discord
        object_matchers:
          - ["severity", "=", "critical"]
        group_by: ["alertname"]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
        continue: false

      - receiver: busmate-discord
        object_matchers:
          - ["severity", "=", "warning"]
        group_by: ["alertname"]
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 6h
        continue: false
