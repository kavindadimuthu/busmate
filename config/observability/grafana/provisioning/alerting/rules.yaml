apiVersion: 1

# Alert rules as code (Phase 4). Each rule follows the standard 3-node pattern Grafana's
# own "New alert rule" wizard generates: A = the real query, B = reduce(A) to a scalar,
# C = threshold(B) — condition points at C. Kept explicit here (rather than a bare
# instant query) so every rule is portable across Grafana versions.
#
# All rules query Prometheus/Loki directly (no shared "recording rules" yet — traffic
# is low enough that raw queries are cheap). Revisit if evaluation load grows.
groups:
  - orgId: 1
    name: busmate-availability
    folder: BusMate
    interval: 1m
    rules:
      - uid: busmate-service-down
        title: "Service down"
        condition: C
        # `up`/`probe_success` are always present (0 or 1) for a statically configured target,
        # so NoData here means the target itself vanished from prometheus.yml — worth flagging.
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          # instance, not job: Postgres and MinIO (INC-036) share this rule via probe_success,
          # whose job label is just "blackbox-postgres"/"blackbox-minio" — instance is the one
          # label both branches carry meaningfully ("core-service:9010", "postgres:5432", ...).
          summary: "{{ $labels.instance }} has been unreachable for 2+ minutes"
          description: >
            Prometheus could not reach {{ $labels.instance }}. If it's an app service, check
            `docker ps` / `docker logs`; if it's Postgres or MinIO, that's the same signal their
            own healthcheck already uses — check whether the container is actually down before
            assuming the probe is wrong.
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: >-
                up{job=~"api-gateway|core-service|user-service|ticketing-service"}
                or probe_success
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: busmate-container-restart-loop
        title: "Container restart loop"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 0m
        # No `for` delay: by the time the count crosses the threshold, the restarts have already
        # happened — waiting longer just means noticing later. This exists specifically because a
        # container crash-looping in cycles shorter than 2 minutes never satisfies
        # busmate-service-down's `for: 2m`, and looks healthy in the gaps between crashes.
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} has restarted repeatedly in the last 10 minutes ({{ $values.B }} distinct restart counts observed)"
          description: "`docker logs {{ $labels.name }} --tail 100` — almost always a crash on startup, not a fluke."
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              # NOT changes() on container_start_time_seconds — verified against a real
              # crash-looping container that this doesn't work. Docker's restart policy re-execs
              # the process inside the SAME container/cgroup, so that metric's value never
              # actually changes on restart; only cAdvisor's synthesized
              # container_label_restartcount label does (it mirrors Docker's own live restart
              # count). A label can't be thresholded directly, so this counts how many distinct
              # values that label took over the window instead — each one is one more restart.
              expr: >-
                count by (name) (
                  count by (name, container_label_restartcount) (
                    last_over_time(container_start_time_seconds{name=~"busmate-.+"}[10m])
                  )
                )
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              # A healthy container reports exactly 1 (one restartcount value: the one it's had
              # since it started). > 3 means at least 3 restarts happened inside the window.
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: C

  - orgId: 1
    name: busmate-performance
    folder: BusMate
    interval: 1m
    rules:
      - uid: busmate-gateway-5xx-rate
        title: "Gateway: high 5xx rate"
        condition: C
        # No data = no traffic in the window, which is not a problem worth alerting on.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "api-gateway 5xx error ratio is {{ $values.B }} (>5% of traffic)"
          description: "Check `docker logs busmate-api-gateway-1` and the downstream services' health."
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: >-
                sum(rate(http_requests_total{status_code=~"5.."}[5m]))
                /
                sum(rate(http_requests_total[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: busmate-spring-5xx-rate
        title: "Spring services: high 5xx rate"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A Spring backend's 5xx error ratio is {{ $values.B }} (>5% of traffic)"
          description: "Check which service via the 'Top endpoints' panel on the Spring Services dashboard, then its logs."
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: >-
                sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                /
                sum(rate(http_server_requests_seconds_count[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: busmate-gateway-p95-latency
        title: "Gateway: high p95 latency"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "api-gateway p95 latency is {{ $values.B }}s (>1s)"
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C

  - orgId: 1
    name: busmate-saturation
    folder: BusMate
    interval: 1m
    rules:
      - uid: busmate-jvm-heap-high
        title: "Spring service: JVM heap near capacity"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap usage is {{ $values.B }} (>85% of max)"
          description: "Sustained high heap risks GC pauses/OOM. Check the JVM panels on the Spring Services dashboard."
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: >-
                sum by (job) (jvm_memory_used_bytes{area="heap"})
                /
                sum by (job) (jvm_memory_max_bytes{area="heap"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.85] }
              refId: C

      - uid: busmate-host-memory-low
        title: "Host: memory running low"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host available memory is {{ $values.B }} of total (<15%)"
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: C

      - uid: busmate-host-disk-low
        title: "Host: disk running low"
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        # Critical, not warning like the memory rule above it: a full disk doesn't just slow
        # things down, it stops Postgres outright (INC-035/036 audit) — the disk is shared
        # between Postgres, MinIO, Prometheus and Loki, so this is the failure most likely to
        # actually take the host down.
        labels:
          severity: critical
        annotations:
          summary: "Host free disk on / is {{ $values.B }} of total (<15%)"
          description: >
            Check the "Containers — memory" panel's disk equivalent isn't the answer here —
            it's usually Loki or Prometheus retention. `docker system df` on the host, and
            `du -sh /opt/busmate/*` for the app's own volumes.
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: >-
                node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
                /
                node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: C

  - orgId: 1
    name: busmate-logs
    folder: BusMate
    interval: 1m
    rules:
      - uid: busmate-error-log-spike
        title: "Error log spike"
        condition: C
        # No data = zero ERROR lines in the window, i.e. the healthy case.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.B }} ERROR-level log lines in the last 5 minutes"
          description: "Open the Logs dashboard, set level=ERROR, and check which service is producing them."
        data:
          - refId: A
            datasourceUid: busmate-loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: loki, uid: busmate-loki }
              expr: 'sum(count_over_time({job="docker"} | json | level=~"ERROR|error" [5m]))'
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: C

  - orgId: 1
    name: busmate-backup
    folder: BusMate
    interval: 5m
    rules:
      - uid: busmate-backup-stale
        title: "Backup stale"
        condition: C
        # Alerting, not OK: unlike "zero ERROR lines", "we don't know when the last backup
        # succeeded" is never the healthy case — including right now, before the metric has
        # ever been written once. That's a real gap worth surfacing, not a false positive.
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in {{ $values.B }} seconds (threshold: 90000, 25h)"
          description: >
            scripts/backup/run-backup.sh (INC-037) only writes its metrics file on full success,
            so this means the last nightly run either never happened or failed partway. Check
            `journalctl -u busmate-backup.service -n 100` on the VPS, and
            `systemctl status busmate-backup.timer` to confirm the timer itself is still active.
        data:
          - refId: A
            datasourceUid: busmate-prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: busmate-prometheus }
              expr: 'time() - backup_last_success_timestamp_seconds'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              # 25 hours: a day's grace beyond the nightly cadence before treating a late
              # backup as stale rather than just running a little behind.
              conditions:
                - evaluator: { type: gt, params: [90000] }
              refId: C
