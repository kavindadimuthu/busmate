apiVersion: 1

# Production-only variant of ../../provisioning/datasources/datasources.yml — Prometheus and
# Loki only. Tempo isn't part of docker-compose.observability.production.yml (ADR-021: tracing
# stays a development tool), so it's dropped here rather than provisioned pointing at a host
# that doesn't exist, which would show a datasource in Grafana that always errors when used, and
# a Loki "TraceID" derived-field link on every log line that leads nowhere.
#
# Mounted in place of the dev file's directory — see docker-compose.observability.production.yml.
# Keep this in sync with the Prometheus/Loki entries above if those ever change.

# Prunes a Tempo datasource left behind if this Grafana volume was ever provisioned from the
# dev directory first (verified necessary: Grafana's file provisioner does not delete a
# datasource just because it stops appearing in the mounted directory — it only reconciles
# what IS present unless told to remove what isn't). A first-ever start on a fresh volume never
# had one, so this is a no-op there.
deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: busmate-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid: busmate-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
