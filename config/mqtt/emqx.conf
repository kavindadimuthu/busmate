## EMQX broker config (IoT Platform Layer plan, Phase 4) — hardware GPS trackers that speak MQTT
## natively connect here instead of the HTTPS ingest path. Base sections below (node/cluster/log/
## dashboard) are EMQX's own defaults, unmodified, extracted from the emqx/emqx:5.8.0 image —
## mounting a custom emqx.conf *replaces* the image's default file rather than merging with it, so
## those required sections must stay present. Only the `authentication` block at the bottom is
## BusMate-specific.
##
## Verified against a real emqx/emqx:5.8.0 container: this exact HOCON parses cleanly (`docker logs`
## shows "EMQX 5.8.0 is running now!", no config errors), and connecting an MQTT client with any
## username/password causes EMQX to POST {"username","password","clientid"} to the configured
## `url` and honor its `{"result":"allow"|"deny"}` response — confirmed end-to-end with a throwaway
## mock HTTP server standing in for MqttAuthController before wiring this at the real endpoint.
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more details.

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

log {
    # file {
    #     level = warning
    # }
    # console {
    #     level = warning
    # }
}

dashboard {
    listeners {
        http {
            ## Comment out 'bind' (or set bind=0) to disable listener.
            bind = 18083
        }
        https {
            ## Uncomment to enable
            # bind = 18084
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

## Device authentication (Phase 4): every MQTT CONNECT is authenticated by delegating to
## telemetry-service's own device registry via MqttAuthController — one device identity shared
## across both the HTTPS (Phase 2) and MQTT ingestion paths, not two separate credential stores.
## The `password` field is the device's `bmt_` bearer token, checked exactly the same way the
## HTTPS path's DeviceTokenAuthenticationFilter does. telemetry-service's own MQTT subscriber
## (MqttIngestAdapter) authenticates through this same mechanism, using a dedicated
## MQTT_CONSUMER-type device row seeded alongside the other demo devices (see
## docs/dev-iot-device-credentials.md) — not a special-cased bypass.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://telemetry-service:9040/internal/mqtt-auth"
    headers {
      "content-type" = "application/json"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    pool_size = 8
    enable_pipelining = 1
  }
]
