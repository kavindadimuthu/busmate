<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusMate (v2 preview) - Sri Lanka Bus Route Information</title>
    <meta name="description" content="Passenger-web v2 — parallel rebuild, not yet public. See ADR-029 / INC-063." />
    <meta name="robots" content="noindex, nofollow" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("busmate.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
