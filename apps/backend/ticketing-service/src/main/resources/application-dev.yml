# Local development: standard self-hosted Postgres (see docker-compose.yml's
# `postgres` service). Not secret — safe to commit. Override any of these with
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD env vars if you run against something else.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/busmate_ticketing
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  # Tier 3 demo data (docs/plans/Database-Migrations-and-Seed-Data-Plan.md §3, §5) — dev profile
  # only. Overrides (not appends to) the base locations list, so it must repeat db/migration
  # alongside the new db/seed/dev. No db/reference here — ticketing-service needed none (Phase 2).
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev
    # The demo seed is numbered V900+ so it always sorts after the schema; a schema migration
    # added later (V003, V004, ...) therefore arrives "below" seed versions already applied to a
    # dev database. Dev only — production has no seed tier, so its history is never interleaved.
    out-of-order: true

logging:
  level:
    com.busmate.ticketing_service: DEBUG
