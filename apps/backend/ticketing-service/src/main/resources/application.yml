# Loads secrets from the central config/secrets/.env (via spring-dotenv).
# Resolved relative to the working directory (apps/backend/ticketing-service).
# No-ops if the file is absent (e.g. in Docker, where env comes from env_file).
springdotenv:
  directory: ../../../config/secrets

spring:
  datasource:
    # Credentials come from config/secrets/.env (TICKETING_DB_*). The fallbacks
    # are obvious placeholders — never real secrets. Set the env vars for real use.
    url: ${TICKETING_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${TICKETING_DB_USERNAME:postgres}
    password: ${TICKETING_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

    # HikariCP Connection Pool Configuration for Supabase
    hikari:
      # Connection pool sizing - conservative for pooler
      minimum-idle: 2
      maximum-pool-size: 8

      # Connection timeout settings
      connection-timeout: 15000 # 15 seconds to get connection from pool
      idle-timeout: 300000 # 5 minutes idle before eviction
      max-lifetime: 900000 # 15 minutes max connection age

      # Validation and keep-alive
      validation-timeout: 5000 # 5 seconds for connection validation
      connection-test-query: SELECT 1 # Simple query to validate connections
      leak-detection-threshold: 60000 # 1 minute leak detection

      # Pool behavior for intermittent connectivity
      initialization-fail-timeout: 30000 # 30 seconds to retry failed initialization

      # Connection pool name for logging
      pool-name: BusMateTicketHikariPool

      # Important: Disable auto-commit for transaction management
      auto-commit: false

  jpa:
    hibernate:
      # Baseline migration (V001) lands the schema; Hibernate only verifies it matches the
      # entities now — see docs/plans/Database-Migrations-and-Seed-Data-Plan.md Phase 1.
      ddl-auto: validate
    show-sql: false # Reduce logging overhead
    properties:
      hibernate:
        format_sql: false # Reduce logging overhead
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # Connection and transaction optimization
        jdbc:
          time_zone: UTC
          batch_size: 25
          batch_versioned_data: true

        # Query optimization for pooled connections
        connection:
          provider_disables_autocommit: true

        # Statement caching
        query:
          plan_cache_max_size: 128

    # Database initialization mode
    database-platform: postgresql
  # Flyway owns schema lifecycle (db/migration). Existing databases (built by the former
  # ddl-auto=update) have no Flyway history, so baseline-on-migrate adopts V001__baseline.sql
  # as already-applied instead of re-running it; a genuinely fresh database runs V001 for real.
  # See docs/plans/Database-Migrations-and-Seed-Data-Plan.md Phase 1.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: dev # Safe local default (local Postgres); override via SPRING_PROFILES_ACTIVE=prod in production deploys

server:
  port: ${SERVER_PORT:9030}

# Ensure Swagger UI is properly configured and cached correctly
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    cache-disabled: true # Disable caching to always show latest API
  api-docs:
    enabled: true
    path: /v3/api-docs

payhere:
  # From config/secrets/.env (INC-008). merchant-secret has no real fallback - the obvious
  # placeholder below can only ever produce hashes PayHere itself would reject.
  merchant-id: ${TICKETING_PAYHERE_MERCHANT_ID:sandbox-merchant-id-not-set}
  merchant-secret: ${TICKETING_PAYHERE_MERCHANT_SECRET:dev-only-placeholder-not-a-real-secret}
  sandbox: ${TICKETING_PAYHERE_SANDBOX:true}
  checkout:
    # INC-013/ADR-014. Off until a human sets real sandbox credentials and a public tunnel and
    # confirms a live test - DummyPaymentGateway is the active PaymentGateway bean until then.
    enabled: ${TICKETING_PAYHERE_CHECKOUT_ENABLED:false}
    url: ${TICKETING_PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
    app-base-url: ${PASSENGER_WEB_URL:http://localhost:4000}
    # PayHere assigns one secret per registered Domain/App - this is NOT the same value as
    # payhere.merchant-secret above (that one belongs to the conductor mobile app, INC-008).
    merchant-secret: ${TICKETING_PAYHERE_CHECKOUT_MERCHANT_SECRET:dev-only-placeholder-not-a-real-secret}
    # Must be a tunnel (cloudflared/ngrok) while testing - PayHere's servers cannot reach
    # localhost. TICKETING_SERVICE_URL/CORE_SERVICE_URL already exist for the same reason
    # this needs its own var: this one must be the *gateway's* public address, not this
    # service's own.
    gateway-base-url: ${PUBLIC_GATEWAY_URL:http://localhost:8080}

supabase:
  # From config/secrets/.env. api.key is the public anon key; auth.url is not
  # sensitive — real fallbacks are fine. jwt.secret IS sensitive, so it falls
  # back to an obvious placeholder — set SUPABASE_JWT_SECRET for real use.
  api:
    key: ${TICKETING_SUPABASE_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2eGJ6Y3hqdWVnaHZydHNmZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkyODAzMjksImV4cCI6MjA2NDg1NjMyOX0.b8JmC_Q-O6K5k_5gpIiQWIDKE5jqyQxb9FgrfJzngkg}
  auth:
    url: ${TICKETING_SUPABASE_AUTH_URL:https://gvxbzcxjueghvrtsfdxc.supabase.co/auth/v1}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:dev-only-placeholder-jwt-secret-change-me}

logging:
  level:
    com.busmate.ticketing_service: INFO # Reduce debug logging
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: DEBUG # Enable HikariCP logging for monitoring
    org.springframework.jdbc: WARN
    org.postgresql: WARN

  # Configure connection pool logging
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,hikaricp,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    hikaricp:
      enabled: true # Enable HikariCP metrics endpoint
  health:
    db:
      enabled: true
  metrics:
    distribution:
      # Emit histogram buckets for HTTP server timings so Prometheus can derive p95/p99.
      percentiles-histogram:
        "[http.server.requests]": true
    export:
      simple:
        enabled: true

# Connection retry and resilience configuration
resilience4j:
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - org.postgresql.util.PSQLException
          - org.springframework.dao.DataAccessResourceFailureException

# core-service owns trips, routes and fleet; ticketing-service reads the facts it needs to price a
# booking from there (INC-011) rather than trusting a client-supplied fare. Called directly on its
# /internal/** surface with the shared key - the gateway authenticates end users, and this is one
# backend asking another. Both values already exist in config/secrets/.env.
core-service:
  base-url: ${CORE_SERVICE_URL:http://localhost:9010}
  internal-api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}

# How a passenger's own online booking behaves (INC-011).
booking:
  # A seat stops being sellable this long before the bus leaves the passenger's boarding stop -
  # long enough to reach the stop, and for the booking to reach the conductor before the bus does.
  cutoff-minutes-before-departure: 30
  # One payment, one ticket per seat. A cap exists so a single request cannot hold a whole bus.
  max-seats-per-booking: 5
  # How long an unpaid online booking holds its seat before another passenger can take it (INC-012).
  hold-minutes: 10
  # How often the sweep looks for expired holds to free, independent of anyone else trying to
  # book that seat - this is what makes a conductor's seat map correct even if nobody retries.
  hold-sweep-interval-ms: 60000
