# Test-only config. Fully replaces src/main/resources/application.yml on the test classpath
# (test-classes precedes classes, and Spring Boot loads the first application.yml it finds), so
# nothing here inherits from main — no test touches a real Postgres or Supabase. It also does NOT
# set spring.profiles.active, so the 'dev' profile (and its db/seed/dev demo migrations) never
# activates for tests; they get a clean, schema-only database.
#
# The datasource url/username/password are supplied at runtime by AbstractPostgresIntegrationTest's
# Testcontainers @DynamicPropertySource; only the driver is fixed here.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entities match it (same as prod).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: postgresql
  # Real Flyway against real Postgres: Tier 1 (schema baseline) only — ticketing-service has no
  # Tier 2 reference data, and the Tier 3 dev demo seed (classpath:db/seed/dev) is excluded so
  # tests run against a clean schema.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: never

logging:
  level:
    com.busmate.ticketing_service: INFO
    org.springframework: WARN
    org.hibernate: WARN
