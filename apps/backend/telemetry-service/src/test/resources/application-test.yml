# Test profile. Loaded on top of src/main/resources/application.yml for tests annotated
# @ActiveProfiles("test"). The datasource url/username/password come at runtime from
# AbstractPostgresIntegrationTest's Testcontainers @DynamicPropertySource (a real postgres:16-alpine
# container), and spring.kafka.bootstrap-servers is pointed at an @EmbeddedKafka broker by the test,
# so the suite runs anywhere Docker is available (CI included). See
# docs/plans/Database-Migrations-and-Seed-Data-Plan.md Phase 4 and docs/plans/IoT-Platform-Layer-Plan.md.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Real Flyway against real Postgres: schema (Tier 1) + reference (Tier 2). The Tier 3 dev demo
  # seed (classpath:db/seed/dev) never loads here because the 'test' profile — not 'dev' — is active.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/reference
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: never

server:
  port: 0

logging:
  level:
    com.busmatelk.telemetry: DEBUG
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
