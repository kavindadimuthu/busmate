spring:
  application:
    name: User_management
    
  datasource:
    # Change from direct connection to transaction pooler with optimized settings
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?connectTimeout=10&socketTimeout=30&loginTimeout=10&prepareThreshold=0&preparedStatementCacheQueries=0&reWriteBatchedInserts=true&tcpKeepAlive=true&autoCommit=false&sslmode=require
    username: postgres.gvxbzcxjueghvrtsfdxc
    password: v9usBELRIbQjMVAQ
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Connection Pool Configuration for Supabase
    hikari:
      # Connection pool sizing - conservative for pooler
      minimum-idle: 2
      maximum-pool-size: 8
      
      # Connection timeout settings
      connection-timeout: 15000          # 15 seconds to get connection from pool
      idle-timeout: 300000              # 5 minutes idle before eviction
      max-lifetime: 900000              # 15 minutes max connection age
      
      # Validation and keep-alive
      validation-timeout: 5000          # 5 seconds for connection validation
      connection-test-query: SELECT 1   # Simple query to validate connections
      leak-detection-threshold: 60000   # 1 minute leak detection
      
      # Pool behavior for intermittent connectivity
      initialization-fail-timeout: 30000 # 30 seconds to retry failed initialization
      
      # Connection pool name for logging
      pool-name: BusMateUserHikariPool
      
      # Important: Disable auto-commit for transaction management
      auto-commit: false
      
  jpa:
    hibernate:
      # Change to update to avoid connection issues on startup
      ddl-auto: update
    show-sql: false  # Reduce logging overhead
    properties:
      hibernate:
        format_sql: false  # Reduce logging overhead
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
        # Connection and transaction optimization
        jdbc:
          time_zone: UTC
          batch_size: 25
          batch_versioned_data: true
        
        # Query optimization for pooled connections
        connection:
          provider_disables_autocommit: true
          
        # Statement caching
        query:
          plan_cache_max_size: 128
          
    defer-datasource-initialization: true
    
    # Database initialization mode
    database-platform: postgresql
  sql:
    init:
      # Set to never to avoid connection issues during SQL execution
      mode: never  # Disable to avoid duplicate data and connection issues
      continue-on-error: true  # Continue if some SQL statements fail
      
  profiles:
    active: production  # Enable production profile
    
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: operator-events
    consumer:
      group-id: busmate-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

