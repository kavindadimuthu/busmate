# Production: our own Postgres, on the same host as the rest of the stack (ADR-020).
# Values come from config/secrets/.env (USER_DB_*), with the URL and username set by
# docker-compose.production.yml — no local fallback here, so a missing secret fails
# startup loudly instead of silently connecting to the wrong place.
spring:
  datasource:
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
