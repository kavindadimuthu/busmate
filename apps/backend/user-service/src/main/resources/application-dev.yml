# Local development: standard self-hosted Postgres (see docker-compose.yml's
# `postgres` service). Not secret — safe to commit. Override any of these with
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD env vars if you run against something else.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/busmate_user
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  # Tier 3 demo data (docs/plans/Database-Migrations-and-Seed-Data-Plan.md §3, §5) — dev profile
  # only. Overrides (not appends to) the base locations list, so it must repeat db/migration and
  # db/reference alongside the new db/seed/dev.
  flyway:
    locations: classpath:db/migration,classpath:db/reference,classpath:db/seed/dev

logging:
  level:
    com.busmate: DEBUG
