# Test-only config. This file fully replaces src/main/resources/application.yml for the test
# classpath (Spring Boot resolves the first "application.yml" it finds; test-classes precedes
# classes on the test classpath) — so nothing here inherits from main, and no test ever touches
# a real Postgres or the real Supabase Auth API. SupabaseAuthClient itself is always
# @MockBean-replaced in tests that need it, so the supabase.* values below just need to satisfy
# @Value injection at context startup, not point anywhere real.
#
# The datasource url/username/password are supplied at runtime by AbstractPostgresIntegrationTest's
# Testcontainers @DynamicPropertySource — the values here are only a fallback so the context can
# resolve placeholders; every @SpringBootTest extends that base class and gets the real container.
spring:
  application:
    name: User_management
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway (below) owns the schema; Hibernate only validates the entities match it — same as
      # the main/prod config, so tests catch entity/migration drift instead of hiding it (Phase 4).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Real Flyway against real Postgres: Tier 1 (schema) + Tier 2 (RBAC reference data). The dev-only
  # Tier 3 demo seed (classpath:db/seed/dev) is deliberately NOT included — tests get a clean,
  # reference-only database and create whatever domain rows they need themselves.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/reference
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    bootstrap-servers: localhost:9092

supabase:
  url: https://test-project.supabase.co
  anon-key: test-anon-key
  jwt:
    secret: test-jwt-secret-for-automated-tests-only
  api:
    key: test-service-role-key

# In-house auth signing config. Shares the same secret as supabase.jwt.secret above so tokens
# TokenService issues verify with the same key JwtAuthFilter uses (mirrors the main config,
# where auth.jwt.secret defaults to SUPABASE_JWT_SECRET).
auth:
  jwt:
    secret: test-jwt-secret-for-automated-tests-only
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
    issuer: busmate-user-service-test
  # spring.mail.host is left unset below, so EmailService always takes its "log instead of send"
  # path in tests — no test ever touches a real mailbox. Tests that need to observe an email
  # "sent" mock EmailService itself rather than relying on that log line.
  email:
    from: test-no-reply@busmate.test
    reset-password-url: http://localhost:3000/reset-password
    verify-email-url: http://localhost:3000/verify-email
  # JwtSocialIdentityVerifier is @MockitoBean-replaced in every AuthControllerTest that drives
  # /api/auth/social/**, so these values only need to satisfy @Value injection at context
  # startup, not point anywhere real.
  social:
    google:
      client-id: test-google-client-id
      issuer: https://accounts.google.com
      jwks-uri: https://accounts.google.com/.well-known/jwks-not-used-in-tests
    facebook:
      client-id: test-facebook-client-id
      issuer: https://www.facebook.com
      jwks-uri: https://www.facebook.com/.well-known/jwks-not-used-in-tests

internal:
  api-key: test-internal-api-key

# OperatorSyncClient's @Value("${core-service.url}") has no inline default, so this must be
# set here too — it's never actually dialed in tests (no test drives an operator-typed
# create/update/deactivate/reactivate), but the context still needs the placeholder to resolve.
core-service:
  url: http://localhost:19010

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
