# Loads secrets from the central config/secrets/.env (via spring-dotenv).
# Resolved relative to the working directory (apps/backend/core-service).
# No-ops if the file is absent (e.g. in Docker, where env comes from env_file).
springdotenv:
  directory: ../../../config/secrets

spring:
  # A little above media.max-upload-bytes, so an upload merely over the limit is rejected by our
  # own check with a message naming the limit, while an absurd one is cut off before buffering.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    # Credentials come from config/secrets/.env (CORE_DB_*). The fallbacks are
    # obvious placeholders — never real secrets. Set the env vars for real use.
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${CORE_DB_USERNAME:postgres}
    password: ${CORE_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Connection Pool Configuration for Supabase
    hikari:
      # Connection pool sizing - conservative for pooler
      minimum-idle: 2
      maximum-pool-size: 8
      
      # Connection timeout settings
      connection-timeout: 15000          # 15 seconds to get connection from pool
      idle-timeout: 300000              # 5 minutes idle before eviction
      max-lifetime: 900000              # 15 minutes max connection age
      
      # Validation and keep-alive
      validation-timeout: 5000          # 5 seconds for connection validation
      connection-test-query: SELECT 1   # Simple query to validate connections
      leak-detection-threshold: 60000   # 1 minute leak detection
      
      # Pool behavior for intermittent connectivity
      initialization-fail-timeout: 30000 # 30 seconds to retry failed initialization
      
      # Connection pool name for logging
      pool-name: BusMateHikariPool
      
      # Important: Disable auto-commit for transaction management
      auto-commit: false
      
    # platform: postgresql
  jpa:
    hibernate:
      # Baseline migration (V001) lands the schema; Hibernate only verifies it matches the
      # entities now — see docs/plans/Database-Migrations-and-Seed-Data-Plan.md Phase 1.
      ddl-auto: validate
    show-sql: false  # SQL logging disabled
    properties:
      hibernate:
        format_sql: false  # Reduce logging overhead
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # Connection and transaction optimization
        jdbc:
          # Note: time_zone removed - LocalTime fields are timezone-agnostic
          # Setting time_zone: UTC caused 5h30m offset with Asia/Colombo JVM timezone
          batch_size: 25
          batch_versioned_data: true

        # Query optimization for pooled connections
        connection:
          provider_disables_autocommit: true

        # Statement caching
        query:
          plan_cache_max_size: 128

    # Database initialization mode
    database-platform: postgresql
  # Flyway owns schema lifecycle (db/migration). Existing databases (built by the former
  # ddl-auto=update) have no Flyway history, so baseline-on-migrate adopts V001__baseline.sql
  # as already-applied instead of re-running it; a genuinely fresh database runs V001 for real.
  # See docs/plans/Database-Migrations-and-Seed-Data-Plan.md Phase 1.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  profiles:
    active: dev  # Safe local default (local Postgres); override via SPRING_PROFILES_ACTIVE=prod in production deploys

server:
  port: ${SERVER_PORT:9010}

# Bus photos and documents (INC-018, ADR-009). Same bucket and credentials as user-service's
# profile photos; objects are namespaced under buses/ so the two services never collide.
media:
  s3:
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    bucket: ${MEDIA_S3_BUCKET:busmate-media}
    region: ${MEDIA_S3_REGION:us-east-1}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
  # Rejected above this size before anything is written to storage.
  max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:8388608}

# Access tokens are verified against user-service's published signing key (INC-016).
auth:
  jwks-url: ${AUTH_JWKS_URL:http://localhost:9020/public/jwks.json}

# Shared secret gating /internal/**, called directly by user-service (bypassing the
# gateway) to sync operator records. Must match user-service's internal.api-key.
internal:
  api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}

# user-service, for checking a conductor's operator and account status before recording them on a
# bus or trip (INC-019/020). Same shared internal API key, sent the other way.
user-service:
  url: ${USER_SERVICE_URL:http://localhost:9020}

# Contributor agreement (INC-029). The text is a legal document a human writes; until the approved
# version is in place the served text is a draft, and staff cannot accept anyone under it except where
# allow-draft-acceptance is switched on (dev and tests only — never production).
community:
  agreement:
    version: draft-1
    draft: true
    allow-draft-acceptance: ${COMMUNITY_ALLOW_DRAFT_ACCEPTANCE:false}
  proposals:
    # Per contributor, per day, across all entity types they can propose (INC-030).
    daily-cap: ${COMMUNITY_PROPOSALS_DAILY_CAP:20}


logging:
  level:
    com.busmate.routeschedule: INFO  # Reduce debug logging
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: DEBUG  # Enable HikariCP logging for monitoring
    org.springframework.jdbc: WARN
    org.postgresql: WARN
    
  # Configure connection pool logging
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,hikaricp,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    hikaricp:
      enabled: true  # Enable HikariCP metrics endpoint
  health:
    db:
      enabled: true
  metrics:
    distribution:
      # Emit histogram buckets for HTTP server timings so Prometheus can derive p95/p99.
      percentiles-histogram:
        "[http.server.requests]": true
    export:
      simple:
        enabled: true

# Connection retry and resilience configuration
resilience4j:
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - org.postgresql.util.PSQLException
          - org.springframework.dao.DataAccessResourceFailureException

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: operationId
  show-actuator: false
  # /internal/** is service-to-service only (API-key gated, never routed by the gateway); keeping it
  # out of the published contract keeps it out of the generated browser clients too.
  paths-to-exclude: /internal/**

# Base URL for the internal, unauthenticated (GET /api/live/** is permitAll there) calls this
# service makes to fetch a bus's latest live position for real-time ETAs (IoT Platform Layer plan,
# Phase 3). Mirrors telemetry-service's own core.service.url convention for the reverse direction.
telemetry:
  service:
    url: ${TELEMETRY_SERVICE_URL:http://localhost:9040}
  live-eta:
    # Ignore live position data older than this — a stale fix is worse than no fix (falls back to
    # schedule-based times instead of a confidently-wrong ETA).
    max-staleness-seconds: ${TELEMETRY_LIVE_ETA_MAX_STALENESS_SECONDS:600}
    # Used when the live fix has no usable speed (stopped/null) and the route has no historical
    # average either — a conservative city-bus cruising speed.
    fallback-speed-kmh: ${TELEMETRY_LIVE_ETA_FALLBACK_SPEED_KMH:30}
