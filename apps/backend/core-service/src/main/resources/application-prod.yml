# Production: Supabase-hosted Postgres. Values come from config/secrets/.env
# (CORE_DB_*) — no local fallback here, so a missing secret fails startup loudly
# instead of silently connecting to the wrong place.
spring:
  datasource:
    url: ${CORE_DB_URL}
    username: ${CORE_DB_USERNAME}
    password: ${CORE_DB_PASSWORD}
