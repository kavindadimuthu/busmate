# Test profile config. Loaded on top of src/main/resources/application.yml for tests annotated
# @ActiveProfiles("test"). The datasource url/username/password come at runtime from
# AbstractPostgresIntegrationTest's Testcontainers @DynamicPropertySource (a real postgres:16-alpine
# container) — replacing the old hand-configured personal Postgres this file used to point at, so
# tests run anywhere Docker is available (CI included). See
# docs/plans/Database-Migrations-and-Seed-Data-Plan.md, Phase 4.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entities match it (same as prod).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Real Flyway against real Postgres: Tier 1 (schema baseline) only. core-service has no Tier 2
  # reference data, and the Tier 3 dev demo seed (classpath:db/seed/dev, wired into
  # application-dev.yml) never loads here because the 'test' profile — not 'dev' — is active.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  sql:
    init:
      mode: never
  # Disable security auto-config for the controller integration tests (unchanged from before).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

server:
  port: 0 # Use random port for testing

# Test-specific configurations
logging:
  level:
    com.busmate.routeschedule: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: WARN

# Disable Swagger in tests
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
