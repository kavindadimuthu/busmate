name: Deploy to EC2

on:
  push:
    branches:
      - "main"
      - "test-deployment"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot App
        run: |
          ./mvnw clean package -DskipTests
          ls -l target/*.jar  # Verify the JAR exists

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile target/*.jar"  # Space-separated, NOT comma
          target: "~/app-${{ github.repository_owner }}-${{ github.event.repository.name }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app-${{ github.repository_owner }}-${{ github.event.repository.name }}
            ls -l  # Verify files are present
            docker stop ${{ github.event.repository.name }} || true
            docker rm ${{ github.event.repository.name }} || true
            export DOCKER_BUILDKIT=1
            docker build -t ${{ github.event.repository.name }}-image:latest .
            docker run -d --network=host --name ${{ github.event.repository.name }} -p 8083:8083 ${{ github.event.repository.name }}-image:latest
