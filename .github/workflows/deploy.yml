name: Deploy to EC2

on:
  push:
    branches:
      - "main"
      - "test-deployment"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build Spring Boot JAR
      - name: Build Spring Boot App
        run: |
          ./mvnw clean package -DskipTests
          # Verify the JAR exists
          ls -l target/*.jar

      # Step 4: Copy Dockerfile and JAR to EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile target/*.jar"  # Use space, not comma
          target: "~/app-${{ github.repository_owner }}-${{ github.event.repository.name }}"

      # Step 5: Deploy on EC2
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app-${{ github.repository_owner }}-${{ github.event.repository.name }}
            
            # Stop & remove old container if exists
            docker stop ${{ github.event.repository.name }} || true
            docker rm ${{ github.event.repository.name }} || true

            # Enable BuildKit (modern Docker builder)
            export DOCKER_BUILDKIT=1

            # Build latest Docker image
            docker build -t ${{ github.event.repository.name }}:latest .

            # Remove any old dangling images to save space
            docker image prune -af

            # Run the new container in detached mode using host network
            docker run -d --network=host --name ${{ github.event.repository.name }} -p 8083:8083 ${{ github.event.repository.name }}:latest
